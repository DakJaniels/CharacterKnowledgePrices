name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Character Knowledge Prices and publish the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -File ./Publish-CharacterKnowledgePricesRelease.ps1 -Tag "${{ github.ref_name }}" -SkipTag
